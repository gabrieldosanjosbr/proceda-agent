name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Test
        run: go test ./...

  image:
    name: Docker
    runs-on: ubuntu-latest
    needs: test

    # PR testa o código, mas não publica imagem
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/gabrieldosanjosbr/proceda-agent:latest \
            .

      - name: Push image
        run: |
          docker push \
            ghcr.io/gabrieldosanjosbr/proceda-agent:latest