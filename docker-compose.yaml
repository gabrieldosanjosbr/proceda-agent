services:
  proceda-agent:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      PROCEDA_LICENSE_SERVER: http://host.docker.internal:8787

    volumes:
      - proceda-agent-data:/var/lib/proceda
      - proceda-run:/run/proceda
      - /etc/machine-id:/host/etc/machine-id:ro

volumes:
  proceda-run:
  proceda-agent-data: